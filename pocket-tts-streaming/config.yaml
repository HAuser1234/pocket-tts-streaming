name: "Pocket TTS Streaming"
description: "Ultra-low latency streaming TTS using PocketTTS and the Wyoming protocol."
version: "1.0.6"
slug: "pocket_tts_streaming"
url: "https://github.com/HAuser1234/pocket-tts-streaming/tree/main/pocket-tts-streaming"
init: false
startup: services
boot: auto
homeassistant_api: false
arch:
  - aarch64
  - amd64
options:
  hf_token: ""
  language: "english"
  voice: "alba"
  log_level: "info"
  s2s_quick_yield_single_sentence_fragment: true
  s2s_minimum_sentence_length: 15
  s2s_minimum_first_fragment_length: 10
  s2s_force_first_fragment_after_words: 15
  enable_phonetic_dict: true
  pytorch_threads: 4
  speaker_tail_padding: 0.3
schema:
  hf_token: password
  language: list(english|english_2026-01|english_2026-04|french_24l|german|german_24l|portuguese|portuguese_24l|italian|italian_24l|spanish|spanish_24l)
  voice: str
  log_level: list(debug|info|warning|error)
  s2s_quick_yield_single_sentence_fragment: bool
  s2s_minimum_sentence_length: int
  s2s_minimum_first_fragment_length: int
  s2s_force_first_fragment_after_words: int
  enable_phonetic_dict: bool
  pytorch_threads: int(1,)
  speaker_tail_padding: float(0,)
ports:
  10222/tcp: 10222
discovery:
  - wyoming
map:
  - share:rw
